<script>
// Light/dark theme toggle button in the top navigation.
(function () {
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) { return; }
  var icon = toggle.querySelector('i');
  var root = document.documentElement;
  function syncIcon() {
    var dark = root.getAttribute('data-theme') === 'dark';
    icon.setAttribute('class', 'fa ' + (dark ? 'fa-sun-o' : 'fa-moon-o'));
    toggle.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  toggle.addEventListener('click', function (e) {
    e.preventDefault();
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (err) {}
    syncIcon();
  });
  syncIcon();
})();
</script>
<script>
// Hero video: show a paused frame instead of playing for users who
// prefer reduced motion.
(function () {
  var video = document.querySelector('.site-hero-video');
  if (!video) { return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    video.removeAttribute('autoplay');
    video.pause();
  }
})();
</script>
